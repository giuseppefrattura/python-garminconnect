name: SonarQube

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: garmin-service/pom.xml
      - name: Compile Java and prepare dependencies
        run: mvn --batch-mode -f garmin-service/pom.xml -DskipTests compile dependency:copy-dependencies
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sona.giuseppefrattura.it
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=giuseppefrattura_python-garminconnect_f72d6064-895d-49d9-b00d-85c0b004e9da
            -Dsonar.java.binaries=garmin-service/target/classes
            -Dsonar.java.libraries=garmin-service/target/dependency/*.jar
