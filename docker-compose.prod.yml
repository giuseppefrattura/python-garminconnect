services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - REPO_USER=${GHCR_USER:-giuseppefrattura}
      - REPO_PASS=${GHCR_PAT:-}
    restart: unless-stopped

  garmin-proxy:
    image: ghcr.io/giuseppefrattura/garmin-proxy:latest
    container_name: garmin-proxy
    ports:
      - "8080:8080"
    environment:
      - GARMINTOKENS=/tokens
      - GARMIN_API_KEY=${GARMIN_API_KEY:?GARMIN_API_KEY must be set}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ~/.garminconnect:/tokens
    restart: unless-stopped

  garmin-service:
    image: ghcr.io/giuseppefrattura/garmin-service:latest
    container_name: garmin-service
    ports:
      - "8081:8081"
    environment:
      - GARMIN_PROXY_URL=http://garmin-proxy:8080
      - GARMIN_API_KEY=${GARMIN_API_KEY:?GARMIN_API_KEY must be set}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-garmin}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DASHBOARD_USER=${DASHBOARD_USER:?DASHBOARD_USER must be set}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_CLIENT_SECRET=${APPLE_CLIENT_SECRET:-}
      - RENPHO_SERVICE_URL=http://renpho-service:8082
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
    depends_on:
      garmin-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  renpho-service:
    image: ghcr.io/giuseppefrattura/renpho-service:latest
    container_name: renpho-service
    environment:
      - RENPHO_EMAIL=${RENPHO_EMAIL:?RENPHO_EMAIL must be set}
      - RENPHO_PASSWORD=${RENPHO_PASSWORD:?RENPHO_PASSWORD must be set}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-garmin}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.3.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GRAFANA_CLOUD_PROMETHEUS_URL=${GRAFANA_CLOUD_PROMETHEUS_URL:?GRAFANA_CLOUD_PROMETHEUS_URL must be set}
      - GRAFANA_CLOUD_PROMETHEUS_USER=${GRAFANA_CLOUD_PROMETHEUS_USER:?GRAFANA_CLOUD_PROMETHEUS_USER must be set}
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL:?GRAFANA_CLOUD_LOKI_URL must be set}
      - GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER:?GRAFANA_CLOUD_LOKI_USER must be set}
      - GRAFANA_CLOUD_TOKEN=${GRAFANA_CLOUD_TOKEN:?GRAFANA_CLOUD_TOKEN must be set}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
    depends_on:
      - garmin-service
      - garmin-proxy
      - renpho-service

