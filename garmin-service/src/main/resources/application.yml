server:
  port: 8081

spring:
  application:
    name: garmin-service

  security:
    user:
      name: ${DASHBOARD_USER:}
      password: ${DASHBOARD_PASSWORD:}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-placeholder-client-secret}
            scope:
              - email
              - profile
          apple:
            client-id: ${APPLE_CLIENT_ID:apple-placeholder-client-id}
            client-secret: ${APPLE_CLIENT_SECRET:apple-placeholder-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/apple"
            scope:
              - name
              - email
            client-name: Apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:garmin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000       # 5 minutes
      connection-timeout: 10000  # 10 seconds

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Actuator health & prometheus endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

# Custom config
garmin:
  proxy:
    base-url: ${GARMIN_PROXY_URL:http://localhost:8080}
    api-key: ${GARMIN_API_KEY:}
  service:
    api-key: ${GARMIN_API_KEY:}
  hr-zones:
    default-days: ${HR_ZONES_DEFAULT_DAYS:10}
  workouts:
    search-limit: ${WORKOUTS_SEARCH_LIMIT:30}
  renpho:
    url: ${RENPHO_SERVICE_URL:http://renpho-service:8082}

# Logging
logging:
  level:
    org.springframework.retry: DEBUG
    it.giuseppefrattura.garminservice: INFO
