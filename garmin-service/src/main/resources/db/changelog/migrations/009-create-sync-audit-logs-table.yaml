databaseChangeLog:
  - changeSet:
      id: 009-create-sync-audit-logs-table
      author: giuseppefrattura
      changes:
        - createTable:
            tableName: sync_audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sync_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: triggered_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: garmin_workouts_count
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: garmin_health_days
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: renpho_measurements_count
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: error_message
                  type: TEXT
